name: CI Pipeline
# Reusable Workflow
on:
  workflow_call:
    inputs:
      DOCKERHUB_USERNAME:
        type: string
        required: true
      run_unit_tests:
        description: "Run Unit Tests"
        type: boolean
        required: false
        default: true
      run_build:
        description: "Create Image"
        type: boolean
        required: false
        default: true
      run_codeql:
        description: "Run GitHub Code Scanning"
        type: boolean
        required: false
        default: true
      run_sonar:
        description: "Run Sonar Scan"
        type: boolean
        required: false
        default: true
      publish_docker:
        description: "Publish Image to Docker Hub"
        type: boolean
        required: false
        default: true
      publish_ghcr:
        description: "Publish Image to GitHub Registry"
        type: boolean
        required: false
        default: true
    secrets:
      SONAR_TOKEN:
        required: true
      DOCKERHUB_TOKEN:
        required: true

permissions:
  contents: read

jobs:
  unit-tests:
    if: ${{ inputs.run_unit_tests }}
    name: Unit testing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --only-binary :all: -r requirements.txt
      - name: Run Tests
        run: |
          mkdir -p reports/
          pytest --junitxml=reports/unit-test-results.xml --cov=. --cov-report=xml:reports/coverage.xml --cov-report=term-missing -v
      - name: Upload code coverage report
        uses: actions/upload-artifact@v7
        with:
          name: code-test-report
          path: reports/
  analyze:
    if: ${{ inputs.run_codeql }}
    name: Analyze (${{ matrix.language }})
    runs-on: ${{ (matrix.language == 'swift' && 'macos-latest') || 'ubuntu-latest' }}
    permissions:
      # required for all workflows
      security-events: write

      # required to fetch internal or private CodeQL packs
      packages: read

      # only required for workflows in private repositories
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: python
            build-mode: none
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      - name: Run manual build steps
        if: matrix.build-mode == 'manual'
        shell: bash
        run: |
          echo 'If you are using a "manual" build mode for one or more of the' \
            'languages you are analyzing, replace this with the commands to build' \
            'your code, for example:'
          echo '  make bootstrap'
          echo '  make release'
          exit 1

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{matrix.language}}"

  sonarqube:
    if: ${{ inputs.run_sonar }}
    name: SonarQube
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Shallow clones should be disabled for a better relevancy of analysis
      - name: Download Coverage report
        uses: actions/download-artifact@v7
        with:
          name: code-test-report
          path: reports/
      - name: Cache SonarQube packages
        uses: actions/cache@v6
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@4d1dc0c91ee400dcf8a6dddf2f705ac36542e304
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      - name: SonarQube Quality Gate Check
        uses: SonarSource/sonarqube-quality-gate-action@3cfda8eca512232cb42bd40fd01567cba471db39
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
  build:
    if: ${{ inputs.run_build && !failure() && !cancelled() }}
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [unit-tests, analyze, sonarqube]
    outputs:
      image-tags: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      # - name: Generate Image tags
      #   id: vars
      #   run: |
      #     IMAGE_TAGS="${{ github.run_id }}-${GITHUB_SHA::7}"
      #     echo "IMAGE_TAGS=$IMAGE_TAGS" >> $GITHUB_OUTPUT
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: test-app
          tags: |
            type=sha,format=short
            type=raw,value=${{ github.run_id }}
      - name: Build Image w out pushing
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: ${{ steps.meta.outputs.tags }}
      - name: Save Image as artifact
        run: docker save test-app:${{ steps.meta.outputs.version }} -o test-app.tar
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: test-app_image
          path: ./test-app.tar
  publish-dockerhub:
    if: ${{ inputs.publish_docker }}
    name: Publish Image to Docker Hub
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download the Image
        uses: actions/download-artifact@v7
        with:
          name: test-app_image
          path: .
      - name: Load Docker Image
        run: docker load -i test-app.tar
      - name: Docker Login
        uses: docker/login-action@v4
        with:
          username: ${{ inputs.DOCKERHUB_USERNAME  }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Tag Image
        run: |
          IMAGE_TAG="${{ needs.build.outputs.image-tags }}"
          docker image tag test-app:$IMAGE_TAG ${{ inputs.DOCKERHUB_USERNAME }}/test-app:$IMAGE_TAG
      - name: Push Image
        run: |
          IMAGE_TAG="${{ needs.build.outputs.image-tags }}"
          docker image push ${{ inputs.DOCKERHUB_USERNAME }}/test-app:$IMAGE_TAG
  publish-ghcr:
    if: ${{ inputs.publish_ghcr }}
    name: Publish Image to GitHub Container Registry
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download the Image
        uses: actions/download-artifact@v7
        with:
          name: test-app_image
          path: .
      - name: Load Docker Image
        run: docker load -i test-app.tar
      - name: GHCR Login
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor  }}
          password: ${{ secrets.GITHUB_TOKEN }} # Automatically generated by GitHub
      - name: Tag Image
        run: |
          IMAGE_TAG="${{ needs.build.outputs.image-tags }}"
          REPO_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          docker image tag test-app:$IMAGE_TAG ghcr.io/$REPO_OWNER/test-app:$IMAGE_TAG
      - name: Push Image
        run: |
          IMAGE_TAG="${{ needs.build.outputs.image-tags }}"
          REPO_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          docker image push ghcr.io/$REPO_OWNER/test-app:$IMAGE_TAG
